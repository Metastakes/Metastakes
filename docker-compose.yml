version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: neurobridge-db
    environment:
      POSTGRES_USER: neurobridge
      POSTGRES_PASSWORD: neurobridge_dev_password
      POSTGRES_DB: neurobridge_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurobridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache & Sessions)
  redis:
    image: redis:7-alpine
    container_name: neurobridge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neurobridge-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://neurobridge:neurobridge_dev_password@postgres:5432/neurobridge_dev
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker (Background Tasks)
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neurobridge-celery
    environment:
      - DATABASE_URL=postgresql://neurobridge:neurobridge_dev_password@postgres:5432/neurobridge_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A tasks worker --loglevel=info

  # Celery Beat (Scheduled Tasks)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neurobridge-celery-beat
    environment:
      - DATABASE_URL=postgresql://neurobridge:neurobridge_dev_password@postgres:5432/neurobridge_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A tasks beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
